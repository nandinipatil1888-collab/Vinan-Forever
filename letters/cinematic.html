<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Our Forever ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia,serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

body{
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

#bg{
position:fixed;
inset:0;
background-image:url("IMG_0331.jpeg");
background-size:cover;
background-position:center;
transform:scale(1);
animation:kenburns 18s linear infinite;
z-index:-3;
}

#overlay{
position:fixed;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.88),
rgba(0,0,0,.45),
rgba(0,0,0,.15)
);
z-index:-2;
}

#welcome{
width:100%;
padding:35px;
text-align:center;
color:white;
}

h1{
font-size:44px;
margin-bottom:25px;
text-shadow:0 4px 15px black;
}

p{
font-size:24px;
line-height:1.8;
max-width:700px;
margin:auto;
margin-bottom:40px;
text-shadow:0 3px 12px black;
}

button{
padding:18px 38px;
margin:12px;
border:none;
border-radius:50px;
font-size:20px;
font-weight:bold;
cursor:pointer;
color:white;
background:linear-gradient(135deg,#ff4fa3,#b5179e);
}

@keyframes kenburns{

0%{
transform:scale(1);
}

100%{
transform:scale(1.12);
}

}

</style>

</head>

<body>

<div id="bg"></div>

<div id="overlay"></div>

<div id="welcome">

<h1>❤️ Our Forever ❤️</h1>

<p>
Before you read every chapter...
I want you to hear my voice.
Every word comes from my heart.
</p>

<button onclick="playVoice()">
🎙️ Play My Voice
</button>

<button onclick="beginStory()">
Begin Our Story ❤️
</button>

</div>

<audio id="voice">
<source src="New Recording.m4a" type="audio/mp4">
</audio>

<script>

const voice=document.getElementById("voice");

function playVoice(){

voice.volume=.5;
voice.play();

}

function beginStory(){

alert("Part 2 Coming ❤️");

}

</script>

</body>
</html>
