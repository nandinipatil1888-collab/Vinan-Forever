<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VINAN FOREVER ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#111;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}

.container{

width:100%;
max-width:500px;
padding:20px;
text-align:center;

}

.photo{

width:100%;
border-radius:25px;
box-shadow:0 10px 35px rgba(0,0,0,.4);

animation:fadePhoto 2s ease;

}

.content{

margin-top:25px;
opacity:0;

animation:fadeText 1.5s ease forwards;
animation-delay:2s;

}

h1{

color:#ff4f8b;
font-size:42px;
margin-bottom:15px;

}

h2{

color:white;
font-size:28px;
margin-bottom:20px;

}

p{

color:#dddddd;
font-size:20px;
line-height:1.6;
margin-bottom:35px;

}

.button{

display:inline-block;

padding:18px 40px;

background:#ff4f8b;

color:white;

text-decoration:none;

border-radius:50px;

font-size:22px;

transition:.3s;

}

.button:hover{

transform:scale(1.05);

background:#ff2f73;

}

@keyframes fadePhoto{

from{

opacity:0;
transform:scale(.95);

}

to{

opacity:1;
transform:scale(1);

}

}

@keyframes fadeText{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<img class="photo" src="cover/cover.jpg.jpeg">

<div class="content">

<h1>❤️ VINAN FOREVER ❤️</h1>

<h2>Welcome to Our Forever ❤️</h2>

<p>

Every love story is beautiful...<br>

but ours is my favorite.

</p>

<a class="button" href="questions/page1.html">

Begin Our Journey ❤️

</a>

</div>

</div>

</body>

</html>
