<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Questions ❤️</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#fff5f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:90%;
max-width:650px;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
text-align:center;
}

h1{
color:#ff4f8b;
margin-bottom:15px;
}

#count{
color:#888;
margin-bottom:25px;
font-size:18px;
}

#question{
font-size:28px;
line-height:1.5;
min-height:120px;
display:flex;
justify-content:center;
align-items:center;
}

.buttons{
margin-top:35px;
display:flex;
justify-content:space-between;
}

button{
border:none;
padding:15px 30px;
border-radius:50px;
background:#ff4f8b;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff2f73;
}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Our Questions ❤️</h1>

<div id="count">Question 1 of 10</div>

<div id="question"></div>

<div class="buttons">

<button onclick="previousQuestion()">Previous</button>

<button onclick="nextQuestion()">Next ❤️</button>

</div>

</div>

<script>

const questions=[

"What was your first impression of me? ❤️",

"What is your favorite memory of us? ❤️",

"What is one thing you love most about me? ❤️",

"What song reminds you of us? ❤️",

"What is one dream you want us to achieve together? ❤️",

"What is your favorite photo of us? ❤️",

"What is something I do that always makes you smile? ❤️",

"What place would you love to visit with me? ❤️",

"What is one thing you never want to change about us? ❤️",

"What does forever with me look like? ❤️"

];

let current=0;

function showQuestion(){

document.getElementById("question").innerHTML=questions[current];

document.getElementById("count").innerHTML="Question "+(current+1)+" of 10";

}

showQuestion();

function nextQuestion(){

if(current<9){

current++;

showQuestion();

}

else{

window.location.href="../memories/index.html";

}

}

function previousQuestion(){

if(current>0){

current--;

showQuestion();

}

}

</script>

</body>

</html>
