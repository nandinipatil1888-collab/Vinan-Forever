<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questions For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:linear-gradient(-45deg,#ffd6e7,#ffe6f2,#fff8fb,#ffdbe9);

background-size:400% 400%;

animation:bgMove 15s ease infinite;

}

@keyframes bgMove{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

.card{

position:relative;

z-index:5;

width:92%;

max-width:760px;

padding:35px;

border-radius:30px;

background:rgba(255,255,255,.60);

backdrop-filter:blur(18px);

text-align:center;

box-shadow:0 15px 45px rgba(255,105,180,.28);

animation:fadeUp .9s;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

font-size:38px;

color:#ff4f8b;

margin-bottom:15px;

animation:heartbeat 1.8s infinite;

}

@keyframes heartbeat{

0%,100%{transform:scale(1);}

50%{transform:scale(1.05);}

}

#message{

font-size:22px;

color:#666;

line-height:1.7;

min-height:90px;

margin-bottom:25px;

}
#progress{

width:100%;

height:12px;

background:#ffe4ef;

border-radius:20px;

overflow:hidden;

margin-bottom:30px;

}

#bar{

width:0%;

height:100%;

background:linear-gradient(90deg,#ff4f8b,#ff8bb6);

transition:.5s;

}

#question{

font-size:30px;

color:#444;

line-height:1.6;

min-height:130px;

margin-bottom:25px;

}

textarea{

width:100%;

height:170px;

padding:18px;

border:none;

outline:none;

border-radius:20px;

font-size:18px;

resize:none;

background:white;

box-shadow:0 0 20px rgba(255,105,180,.18);

}

button{

margin-top:30px;

padding:18px 40px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:20px;

cursor:pointer;

transition:.3s;

box-shadow:0 0 25px rgba(255,79,139,.45);

}

button:hover{

transform:scale(1.07);

background:#ff2f73;

}

.heart{

position:fixed;

bottom:-40px;

pointer-events:none;

animation:floatHeart linear forwards;

}

@keyframes floatHeart{

0%{transform:translateY(0);opacity:1;}

100%{transform:translateY(-120vh);opacity:0;}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Just A Few Questions ❤️</h1>

<div id="message"></div>

<div id="progress">

<div id="bar"></div>

</div>

<div id="question"></div>

<textarea id="answer"

placeholder="Write your answer here... ❤️"></textarea>

<button id="nextBtn">

Next ❤️

</button>

</div>

<script>
const messages=[

"Hey Handsome ❤️ Before we continue... I just want to know your heart a little more... 🥹",

"Every answer you write will become a forever memory for us ❤️",

"I promise I'll read every word with the biggest smile ❤️",

"Take your time... I'm right here with you ❤️",

"I already know some answers... but I still want to hear them from you ❤️",

"Your words are priceless to me ❤️",

"I'm secretly smiling while you're answering these ❤️",

"Thank you for doing this for me... it means everything ❤️"

];

const questions=[

"What was your very first impression of me? ❤️",

"When did you realise you were falling for me? ❤️",

"What is your favourite memory with me? ❤️",

"What do you love the most about me? ❤️",

"Which moment made you happiest with me? ❤️",

"What is one thing you never want to change about us? ❤️",

"If you could relive one day with me, which day would it be? ❤️",

"What do you think our future looks like? ❤️",

"What nickname do you secretly love the most? ❤️",

"What would you like to tell me right now? ❤️"

];

let current=0;

const msg=document.getElementById("message");

const question=document.getElementById("question");

const answer=document.getElementById("answer");

const nextBtn=document.getElementById("nextBtn");

const bar=document.getElementById("bar");

function typeWriter(element,text,speed){

element.innerHTML="";

let i=0;

const t=setInterval(()=>{

element.innerHTML+=text.charAt(i);

i++;

if(i>=text.length){

clearInterval(t);

}

},speed);

}

function showQuestion(){

typeWriter(msg,messages[current%messages.length],25);

setTimeout(()=>{

typeWriter(question,questions[current],25);

},900);

bar.style.width=((current)/questions.length)*100+"%";

}

showQuestion();
nextBtn.onclick=function(){

localStorage.setItem("answer"+current,answer.value);

answer.value="";

current++;

if(current<questions.length){

showQuestion();

}else{

document.querySelector(".card").innerHTML=`

<h1>❤️ Thank You ❤️</h1>

<p style="font-size:24px;line-height:1.8;color:#555;margin-top:30px;">

Every answer you've written is now part of our forever story... ❤️

<br><br>

Thank you for giving your heart to me.

<br><br>

I love you endlessly. ❤️

</p>

<button onclick="location.href='../memories/'">

Continue Our Journey ❤️

</button>

`;

}

};

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=Math.random()>0.5?"❤️":"💖";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(18+Math.random()*20)+"px";

heart.style.animationDuration=(5+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);

},700);

</script>

</body>

</html>
