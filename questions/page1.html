<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questions For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:Arial,Helvetica,sans-serif;

overflow-x:hidden;
overflow-y:auto;
min-height:100vh;

display:flex;
justify-content:center;
align-items:flex-start;

padding:40px 20px;

background:
radial-gradient(circle at top,#ffeaf3,#ffd6e7 35%,#f8dfff 70%,#e8d8ff);

position:relative;

}

body::before{

content:"";

position:fixed;

inset:0;

background:

radial-gradient(circle,#ffffff88 1px,transparent 2px);

background-size:40px 40px;

animation:stars 25s linear infinite;

pointer-events:none;

}

@keyframes stars{

from{transform:translateY(0);}

to{transform:translateY(40px);}

}

.card{

width:95%;
max-width:760px;

padding:35px;

border-radius:35px;

background:rgba(255,255,255,.55);

backdrop-filter:blur(18px);

box-shadow:0 20px 60px rgba(255,105,180,.25);

position:relative;

z-index:5;

animation:fadeUp 1s;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(50px);

}

to{

opacity:1;

transform:translateY(0);

}

}
h1{

font-size:42px;

text-align:center;

color:#ff4f8b;

margin-bottom:25px;

text-shadow:0 0 18px #ffc3da;

animation:heartbeat 1.8s infinite;

}

@keyframes heartbeat{

0%,100%{transform:scale(1);}

50%{transform:scale(1.05);}

}

#hero{

position:relative;

width:220px;

height:220px;

margin:0 auto 30px;

border-radius:30px;

overflow:hidden;

box-shadow:0 0 35px rgba(255,105,180,.45);

}

#hero img{

width:100%;

height:100%;

object-fit:cover;

filter:brightness(.55);

}

#heroText{

position:absolute;

inset:0;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

color:white;

font-size:22px;

font-weight:bold;

text-shadow:0 0 12px black;

}

#message{

font-size:22px;

text-align:center;

line-height:1.7;

color:#555;

margin-bottom:30px;

}
#progress{

width:100%;

height:14px;

background:#ffe5ef;

border-radius:50px;

overflow:hidden;

margin-bottom:35px;

}

#bar{

width:0%;

height:100%;

background:linear-gradient(90deg,#ff4f8b,#ff9ec5);

transition:.5s;

}

#question{

font-size:30px;

text-align:center;

color:#444;

line-height:1.6;

margin-bottom:25px;

min-height:120px;

}

textarea{

width:100%;

height:180px;

padding:20px;

border:none;

border-radius:25px;

outline:none;

font-size:18px;

resize:none;

background:white;

box-shadow:0 0 25px rgba(255,105,180,.18);

margin-bottom:25px;

}

button{

display:block;

margin:auto;

padding:18px 45px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:20px;

cursor:pointer;

box-shadow:0 0 30px rgba(255,105,180,.45);

transition:.3s;

}

button:hover{

transform:scale(1.08);

background:#ff2f73;

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Just A Few Questions ❤️</h1>

<div id="hero">

<img src="images/question-cover.jpg">

<div id="heroText">

Every answer from your heart<br>becomes my forever memory ❤️

</div>

</div>

<div id="message"></div>

<div id="progress">

<div id="bar"></div>

</div>

<div id="question"></div>

<textarea id="answer"

placeholder="Write your answer here... ❤️"></textarea>

<button id="nextBtn">

Next ❤️

</button>

</div>

<script>
const messages=[

"Hey Handsome ❤️ Before we begin... I want you to know that every answer you write will stay with me forever... 🥹",

"Close your eyes for a second... and answer with your heart ❤️",

"I'm smiling already because I know these answers are coming from you ❤️",

"Your words mean more to me than you can ever imagine ❤️",

"Every little memory with you is my biggest treasure ❤️",

"If I could freeze time... I'd freeze every beautiful moment with you ❤️",

"You'll never know how special you make me feel ❤️",

"Thank you for choosing to walk through this little journey with me ❤️"

];

const questions=[

"What was your first impression of me? ❤️",

"When did you realize you were falling in love with me? ❤️",

"What is your favourite memory with me? ❤️",

"What do you love most about me? ❤️",

"What song reminds you of us? ❤️",

"What is your dream date with me? ❤️",

"What is one thing you never want to change about us? ❤️",

"If we could travel anywhere together, where would you take me? ❤️",

"What nickname do you secretly love calling me? ❤️",

"What would you like to tell me today? ❤️"

];

let current=0;

const msg=document.getElementById("message");
const question=document.getElementById("question");
const answer=document.getElementById("answer");
const nextBtn=document.getElementById("nextBtn");
const bar=document.getElementById("bar");

function typeWriter(el,text,speed){

el.innerHTML="";

let i=0;

const t=setInterval(()=>{

el.innerHTML+=text.charAt(i);

i++;

if(i>=text.length){

clearInterval(t);

}

},speed);

}

function showQuestion(){

typeWriter(msg,messages[current%messages.length],22);

setTimeout(()=>{

typeWriter(question,questions[current],22);

},900);

bar.style.width=((current)/questions.length)*100+"%";

}

showQuestion();
nextBtn.onclick=function(){

localStorage.setItem("answer"+current,answer.value);

answer.value="";

current++;

if(current<questions.length){

showQuestion();

}else{

document.querySelector(".card").innerHTML=`

<h1>❤️ Thank You ❤️</h1>

<div style="text-align:center;padding:40px;">

<h2 style="color:#ff4f8b;font-size:34px;">

Our Forever Story ❤️

</h2>

<p style="margin-top:25px;font-size:22px;line-height:1.9;color:#555;">

Every answer you've written is now a beautiful part of our love story.

<br><br>

One day we'll read these together and smile.

<br><br>

I love you endlessly. ❤️

</p>

<button onclick="location.href='../memories/'">

Continue To Our Memories ❤️

</button>

</div>

`;

}

};

</script>

</body>

</html>
