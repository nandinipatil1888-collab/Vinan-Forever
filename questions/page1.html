<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Questions ❤️</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#fff5f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:90%;
max-width:650px;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
text-align:center;
}

h1{
color:#ff4f8b;
margin-bottom:15px;
}

#count{
color:#888;
margin-bottom:25px;
font-size:18px;
}

#question{
font-size:28px;
line-height:1.5;
min-height:120px;
display:flex;
justify-content:center;
align-items:center;
}

.buttons{
margin-top:35px;
display:flex;
justify-content:space-between;
}

button{
border:none;
padding:15px 30px;
border-radius:50px;
background:#ff4f8b;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff2f73;
}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Our Questions ❤️</h1>

<div id="count">Question 1 of 10</div>

<img id="photo" src="photo.jpeg" style="width:100%;max-height:350px;object-fit:cover;border-radius:20px;margin-bottom:20px;">

<div id="question"></div>

<textarea
id="answer"
placeholder="Write your answer here... ❤️"
style="width:100%;height:140px;margin-top:25px;padding:15px;font-size:16px;border-radius:15px;border:2px solid #ffb6cf;resize:none;"></textarea>

<div id="message" style="display:none;color:#ff4f8b;font-weight:bold;margin-top:20px;"></div>

<div class="buttons">

<button onclick="previousQuestion()">Previous</button>

<button onclick="nextQuestion()">Next ❤️</button>

</div>

</div>

<script>

const questions=[

{
question:"What was your first impression of me? ❤️",
image:"./photo.jpeg"
},

{
question:"What is your favorite memory of us? ❤️",
image:"IMG_1492.jpeg"
},

{
question:"What is one thing you love most about me? ❤️",
image:"IMG_1493.jpeg"
},

{
question:"What song reminds you of us? ❤️",
image:"IMG_1494.jpeg"
},

{
question:"What is one dream you want us to achieve together? ❤️",
image:"IMG_1495.jpeg"
},

{
question:"What is your favorite photo of us? ❤️",
image:"IMG_1496.jpeg"
},

{
question:"What is something I do that always makes you smile? ❤️",
image:"IMG_1497.jpeg"
},

{
question:"What place would you love to visit with me? ❤️",
image:"IMG_1498.jpeg"
},

{
question:"What is one thing you never want to change about us? ❤️",
image:"IMG_1499.jpeg"
},

{
question:"What does forever with me look like? ❤️",
image:"IMG_1500.jpeg"
}

];
let current=0;

function showQuestion(){

document.getElementById("question").innerHTML=questions[current].question;

document.getElementById("photo").src=questions[current].image;

document.getElementById("count").innerHTML="Question "+(current+1)+" of 10";

document.getElementById("answer").value=localStorage.getItem("answer"+current)||"";

document.getElementById("message").style.display="none";

}

showQuestion();

function nextQuestion(){

localStorage.setItem("answer"+current,document.getElementById("answer").value);

const messages=[

"You always make my heart smile ❤️",

"Every memory with you is priceless ❤️",

"I can't wait to read all your answers ❤️",

"You are my favourite person ❤️",

"Our story keeps getting more beautiful ❤️",

"You make every day special ❤️",

"I'll treasure these words forever ❤️",

"My heart is full because of you ❤️",

"Almost there, my love ❤️",

"Thank you for completing our love story ❤️"

];

document.getElementById("message").innerHTML=messages[current];

document.getElementById("message").style.display="block";

setTimeout(function(){

if(current<9){

current++;

showQuestion();

}else{

window.location.href="../memories/index.html";

}

},1200);

}

function previousQuestion(){

if(current>0){

current--;

showQuestion();

}

}

</script>

</body>

</html>
