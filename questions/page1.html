<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questions For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:Arial,Helvetica,sans-serif;

overflow-x:hidden;
overflow-y:auto;

min-height:100vh;

padding:40px 20px;

display:flex;

justify-content:center;

align-items:flex-start;

background:linear-gradient(180deg,#0d0221,#29104b,#ffbdd5);

position:relative;

}

/* ⭐ Stars */

.star{

position:fixed;

width:3px;

height:3px;

background:white;

border-radius:50%;

box-shadow:0 0 12px white;

animation:twinkle 2s infinite alternate;

pointer-events:none;

}

@keyframes twinkle{

from{

opacity:.2;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1.5);

}

}

/* ✨ Glitter */

.glitter{

position:fixed;

font-size:14px;

animation:glitter 5s linear forwards;

pointer-events:none;

}

@keyframes glitter{

0%{

transform:translateY(0) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}

}

/* ❤️ Hearts */

.heart{

position:fixed;

bottom:-40px;

pointer-events:none;

animation:floatHeart linear forwards;

}

@keyframes floatHeart{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

```
/* 🌹 Rose Petals */

.petal{

position:fixed;

top:-40px;

pointer-events:none;

animation:fallPetal linear forwards;

}

@keyframes fallPetal{

0%{

transform:translateY(0) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(120vh) rotate(360deg);

opacity:0;

}

}

/* 💋 Kisses */

.kiss{

position:fixed;

bottom:-40px;

pointer-events:none;

animation:kissFloat 8s linear forwards;

}

@keyframes kissFloat{

0%{

transform:translateY(0) scale(.8);

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.6);

opacity:0;

}

}

#bg{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

object-fit:cover;

filter:brightness(.45) blur(2px);

transition:opacity 1.5s;

z-index:-3;

}

#overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.28);

z-index:-2;

}

.card{

width:95%;

max-width:760px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.35);

border-radius:35px;

padding:35px;

box-shadow:0 25px 70px rgba(255,105,180,.30);

animation:fadeUp 1s;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}
h1{

text-align:center;

font-size:42px;

color:white;

text-shadow:0 0 20px #ff9fc7;

margin-bottom:25px;

}

#message{

text-align:center;

font-size:22px;

line-height:1.7;

color:white;

margin-bottom:25px;

text-shadow:0 0 10px black;

}

#progress{

width:100%;

height:14px;

background:rgba(255,255,255,.25);

border-radius:30px;

overflow:hidden;

margin-bottom:30px;

}

#bar{

width:0%;

height:100%;

background:linear-gradient(90deg,#ff4f8b,#ffd1e6);

transition:.5s;

}

#question{

font-size:30px;

line-height:1.7;

text-align:center;

color:white;

text-shadow:0 0 10px black;

margin-bottom:25px;

min-height:120px;

}

textarea{

width:100%;

height:180px;

padding:20px;

border:none;

outline:none;

border-radius:25px;

font-size:18px;

resize:none;

background:rgba(255,255,255,.9);

margin-bottom:25px;

}

button{

display:block;

margin:auto;

padding:18px 45px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:20px;

cursor:pointer;

box-shadow:0 0 25px rgba(255,105,180,.55);

}

button:hover{

transform:scale(1.08);

}
#photoScreen{

display:flex;

justify-content:center;

align-items:center;

height:70vh;

overflow:hidden;

}

#heroPhoto{

width:100%;

height:100%;

object-fit:contain;

transition:all 2s ease;

border-radius:25px;

box-shadow:0 0 35px rgba(255,255,255,.35);

}

#questionScreen{

opacity:0;

}
</style>

</head>

<body>

<img id="bg" src="IMG_1492.jpeg">

<div id="overlay"></div>

<div class="card">

<div id="photoScreen">

<img id="heroPhoto" src="IMG_1492.jpeg">

</div>

<div id="questionScreen" style="display:none;">

<h1>❤️ Just A Few Questions ❤️</h1>

<div id="message"></div>

<div id="progress">

<div id="bar"></div>

</div>

<div id="question"></div>

<textarea id="answer" placeholder="Write your answer here... ❤️"></textarea>

<button id="nextBtn">Next ❤️</button>

</div>

</div>

<script>
const photos=[
"IMG_1492.jpeg",
"IMG_1493.jpeg",
"IMG_1494.jpeg",
"IMG_1495.jpeg",
"IMG_1496.jpeg",
"IMG_1497.jpeg",
"IMG_1498.jpeg",
"IMG_1499.jpeg",
"IMG_1500.jpeg",
"9111BCA6-96B4-42F2-A795-0E9B49D6A18F.jpeg"
];

const messages=[
"Hey Handsome ❤️ Every answer you write is becoming one more beautiful memory for us...",
"I'm already smiling while imagining your answers ❤️",
"I can't wait to read every single word you write ❤️",
"Thank you for taking this little journey with me ❤️",
"Your words mean more to me than you know ❤️"
];

const questions=[
"What was your first impression of me? ❤️",
"When did you realize you were falling in love with me? ❤️",
"What is your favourite memory with me? ❤️",
"What do you love the most about me? ❤️",
"What is your dream with me? ❤️"
];

let current=0;
let photo=0;

const bg=document.getElementById("bg");
const msg=document.getElementById("message");
const q=document.getElementById("question");
const ans=document.getElementById("answer");
const bar=document.getElementById("bar");

function show(){

msg.innerHTML="";

q.innerHTML="";

bar.style.width=((current)/questions.length)*100+"%";

let m=0;

const msgTyping=setInterval(()=>{

msg.innerHTML+=messages[current%messages.length].charAt(m);

m++;

if(m>=messages[current%messages.length].length){

clearInterval(msgTyping);

let i=0;

const questionTyping=setInterval(()=>{

q.innerHTML+=questions[current].charAt(i);

i++;

if(i>=questions[current].length){

clearInterval(questionTyping);

}

},30);

}

},25);

}

show();

setInterval(()=>{

bg.style.opacity="0";

setTimeout(()=>{

photo=(photo+1)%photos.length;

bg.src=photos[photo];

bg.style.opacity="1";

},900);

},4000);
nextBtn.onclick=function(){

localStorage.setItem("answer"+current,ans.value);

ans.value="";

current++;

if(current<questions.length){

questionScreen.style.opacity="0";

setTimeout(()=>{

playIntro();

},500);

}else{

document.querySelector(".card").innerHTML=`

<h1>❤️ Thank You ❤️</h1>

<p style="text-align:center;font-size:24px;color:white;line-height:1.8;">

Every answer you've written is now part of our forever story... ❤️

</p>

<br>

<button onclick="location.href='../memories/'">

Continue To Memories ❤️

</button>

`;

}

};

</script>

</body>

</html>
