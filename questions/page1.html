<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questions For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:Arial,Helvetica,sans-serif;

background:linear-gradient(180deg,#14001f,#3d0a59,#ffbfd7);

overflow-x:hidden;
overflow-y:auto;

min-height:100vh;

display:flex;
justify-content:center;
align-items:flex-start;

padding:35px 18px;

position:relative;

}

/* ⭐ Stars */

.star{

position:fixed;

width:3px;
height:3px;

background:white;

border-radius:50%;

box-shadow:0 0 15px white;

animation:twinkle 2s infinite alternate;

pointer-events:none;

z-index:-1;

}

@keyframes twinkle{

from{

opacity:.2;
transform:scale(.6);

}

to{

opacity:1;
transform:scale(1.6);

}

}

/* ❤️ Hearts */

.heart{

position:fixed;

bottom:-40px;

pointer-events:none;

animation:heartFloat linear forwards;

}

@keyframes heartFloat{

0%{

transform:translateY(0) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}

}

/* 🌹 Petals */

.petal{

position:fixed;

top:-40px;

pointer-events:none;

animation:petalFall linear forwards;

}

@keyframes petalFall{

0%{

transform:translateY(0) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(120vh) rotate(360deg);

opacity:0;

}

}

.card{

width:100%;
max-width:760px;

background:rgba(255,255,255,.16);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.28);

border-radius:35px;

padding:28px;

box-shadow:0 20px 70px rgba(255,105,180,.35);

overflow:hidden;

position:relative;

}

#intro{

display:flex;

justify-content:center;
align-items:center;

height:72vh;

}

#heroPhoto{

width:100%;
height:100%;

object-fit:contain;

border-radius:25px;

box-shadow:0 0 40px rgba(255,255,255,.35);

opacity:1;

transition:all 2s ease;

}

#main{

display:none;

opacity:0;

transition:1.3s;

}

h1{

text-align:center;

font-size:42px;

color:white;

text-shadow:0 0 18px hotpink;

margin-bottom:25px;

}

#message{

font-size:23px;

text-align:center;

line-height:1.8;

color:white;

text-shadow:0 0 8px black;

margin-bottom:30px;

min-height:90px;

}

#progress{

width:100%;
height:14px;

background:rgba(255,255,255,.25);

border-radius:50px;

overflow:hidden;

margin-bottom:30px;

}

#bar{

width:0%;

height:100%;

background:linear-gradient(90deg,#ff4f8b,#ffd8e9);

transition:.5s;

}
#question{

font-size:32px;

line-height:1.8;

text-align:center;

color:white;

text-shadow:0 0 10px black;

margin-bottom:25px;

min-height:140px;

}

textarea{

width:100%;

height:180px;

padding:20px;

border:none;

outline:none;

border-radius:25px;

font-size:18px;

resize:none;

background:rgba(255,255,255,.92);

margin-bottom:25px;

}

button{

display:block;

margin:auto;

padding:18px 48px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:21px;

cursor:pointer;

box-shadow:0 0 25px rgba(255,105,180,.55);

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

</style>

</head>

<body>

<div class="card">

<div id="intro">

<img id="heroPhoto" src="IMG_1492.jpeg">

</div>

<div id="main">

<h1>❤️ Just A Few Questions ❤️</h1>

<div id="message"></div>

<div id="progress">

<div id="bar"></div>

</div>

<div id="question"></div>

<textarea id="answer" placeholder="Write your answer here... ❤️"></textarea>

<button id="nextBtn" onclick="nextQuestion()">Next ❤️</button>


<script>
const photos=[
"IMG_1492.jpeg",
"IMG_1493.jpeg",
"IMG_1494.jpeg",
"IMG_1495.jpeg",
"IMG_1496.jpeg",
"IMG_1497.jpeg",
"IMG_1498.jpeg",
"IMG_1499.jpeg",
"IMG_1500.jpeg",
"9111BCA6-C7FC-4892-8C8D-C8D118504416.jpeg"
];

const questions=[
"What was your first impression of me? ❤️",
"When did you realise you were falling in love with me? ❤️",
"What is your favourite memory with me? ❤️",
"What do you love the most about me? ❤️",
"What is your favourite thing about us? ❤️",
"What is one moment you'll never forget? ❤️",
"What makes you smile whenever you think about me? ❤️",
"What is your dream with me? ❤️",
"What is your favourite picture of me? ❤️",
"If you could relive one day with me, which day would it be? ❤️"
];

const messages=[
"Hey Handsome ❤️ Every answer you write becomes another beautiful memory for us...",
"I promise I'll read every word with the biggest smile... ❤️",
"Your answers will stay in my heart forever... ❤️",
"You make every moment of my life beautiful... ❤️",
"I love hearing your heart speak... ❤️",
"Thank you for doing this for me... ❤️",
"I can't wait to read your next answer... ❤️",
"You're my favourite person... ❤️",
"Our story is my favourite story... ❤️",
"Just one more question before our memories... ❤️"
];

let current=0;

const hero=document.getElementById("heroPhoto");
const intro=document.getElementById("intro");
const main=document.getElementById("main");

const message=document.getElementById("message");
const question=document.getElementById("question");
const answer=document.getElementById("answer");
const bar=document.getElementById("bar");
function typeText(element,text,speed,callback){

element.innerHTML="";

let i=0;

const timer=setInterval(()=>{

element.innerHTML+=text.charAt(i);

i++;

if(i>=text.length){

clearInterval(timer);

if(callback) callback();

}

},speed);

}

function showQuestion(){

bar.style.width=((current)/questions.length)*100+"%";

typeText(message,messages[current],25,function(){

typeText(question,questions[current],30);

});

}

function playIntro(){

hero.src=photos[current];

intro.style.display="flex";

main.style.display="none";

hero.style.opacity="1";

hero.style.transform="scale(1)";

setTimeout(()=>{

hero.style.transform="scale(1.08)";

},100);

setTimeout(()=>{

hero.style.opacity=".18";

intro.style.display="none";

main.style.display="block";

setTimeout(()=>{

main.style.opacity="1";

showQuestion();

},100);

},2500);

}

playIntro();
function playLoveAndContinue(){

const audio=document.getElementById("loveVoice");

if(audio){
audio.play().catch(()=>{});
}

setTimeout(()=>{
location.href="../memories/";
},2200);

}


function nextQuestion(){

localStorage.setItem(
"answer"+current,
answer.value
);

current++;

if(current < questions.length){

answer.value="";

playIntro();

}else{

location.href="../memories/";

}

}


/* ⭐ Background Effects */

setInterval(()=>{

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

setTimeout(()=>star.remove(),2500);

},200);

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=Math.random()>.5?"❤️":"💖";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(18+Math.random()*18)+"px";

heart.style.animationDuration=(5+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);

},700);

setInterval(()=>{

const petal=document.createElement("div");

petal.className="petal";

petal.innerHTML="🌹";

petal.style.left=Math.random()*100+"vw";

petal.style.fontSize=(18+Math.random()*10)+"px";

petal.style.animationDuration=(6+Math.random()*3)+"s";

document.body.appendChild(petal);

setTimeout(()=>petal.remove(),9000);

},1500);

</script>

</body>

</html>
