<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reasons I Love You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(-45deg,#ffd6e7,#ffe8f2,#fff6fb,#ffd4e8);
background-size:400% 400%;
animation:bgMove 15s ease infinite;

}

@keyframes bgMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.card{

position:relative;
z-index:5;

width:90%;
max-width:700px;

padding:35px;

border-radius:30px;

background:rgba(255,255,255,.58);

backdrop-filter:blur(18px);

box-shadow:0 15px 40px rgba(255,80,130,.25);

text-align:center;

animation:fadeUp .9s;

}

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

h1{

font-size:38px;
color:#ff4f8b;
animation:heartbeat 1.8s infinite;

}

@keyframes heartbeat{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.06);

}

}

#count{

margin-top:15px;
font-size:18px;
color:#777;

}

#reason{

margin-top:35px;
font-size:30px;
line-height:1.7;

min-height:180px;

display:flex;
justify-content:center;
align-items:center;

padding:10px;

color:#444;

transition:.4s;

}

button{

display:block;

margin:35px auto 10px;

padding:18px 42px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:20px;

cursor:pointer;

box-shadow:0 0 25px rgba(255,79,139,.45);

transition:.3s;

}

button:hover{

transform:scale(1.06);

background:#ff2f73;

}
.heart{

position:fixed;

bottom:-40px;

pointer-events:none;

animation:floatHeart linear forwards;

z-index:1;

}

@keyframes floatHeart{

0%{

transform:translateY(0) scale(1);
opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.8);
opacity:0;

}

}

.petal{

position:fixed;

top:-40px;

pointer-events:none;

animation:fall linear forwards;

z-index:2;

}

@keyframes fall{

0%{

transform:translateY(0) rotate(0deg);

}

100%{

transform:translateY(120vh) rotate(360deg);

}

}

.sparkle{

position:fixed;

pointer-events:none;

animation:spark 2.5s linear forwards;

z-index:3;

}

@keyframes spark{

0%{

opacity:1;
transform:scale(.5);

}

100%{

opacity:0;
transform:translateY(-100px) scale(1.8);

}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Reasons I Love You ❤️</h1>

<div id="count">

Reason 1 of 50 ❤️

</div>

<div id="reason"></div>

<button id="nextBtn">

Show Me Another Reason ❤️

</button>

</div>

<script>
const reasons=[

"Because your smile can brighten even my darkest day ❤️",
"Because hearing your voice instantly calms my heart ❤️",
"Because every moment with you becomes my favourite memory ❤️",
"Because your hugs feel like the safest place in the world ❤️",
"Because you always know how to make me smile ❤️",
"Because life became more beautiful after you came into it ❤️",
"Because you understand me even without words ❤️",
"Because your laugh is my favourite sound ❤️",
"Because every little thing reminds me of you ❤️",
"Because you make ordinary days feel magical ❤️",

"Because your love gives me strength ❤️",
"Because you always make me feel special ❤️",
"Because your happiness means so much to me ❤️",
"Because you make my heart skip a beat ❤️",
"Because I can never stay mad at you for long ❤️",
"Because every call with you becomes my favourite part of the day ❤️",
"Because I love the way you care for me ❤️",
"Because you're the first person I want to tell everything to ❤️",
"Because you believe in me when I don't believe in myself ❤️",
"Because you make me feel at home wherever you are ❤️",

"Because your eyes tell stories words never could ❤️",
"Because every memory with you is priceless ❤️",
"Because loving you feels so natural ❤️",
"Because you make me laugh even on my worst days ❤️",
"Because your little habits are adorable ❤️",
"Because you make me want to become a better person ❤️",
"Because every goodbye only makes me miss you more ❤️",
"Because I still smile whenever your name appears on my phone ❤️",
"Because no one understands me like you do ❤️",
"Because you make my world brighter every single day ❤️",

"Because your kindness inspires me ❤️",
"Because you're my comfort after every difficult day ❤️",
"Because even silence feels beautiful with you ❤️",
"Because your hugs fix everything ❤️",
"Because I never get tired of talking to you ❤️",
"Because you're my favourite notification ❤️",
"Because every dream feels better when you're part of it ❤️",
"Because every journey is better with you ❤️",
"Because you're my peace in this chaotic world ❤️",
"Because you're my favourite hello and my hardest goodbye ❤️",

"Because you've filled my life with countless beautiful memories ❤️",
"Because your love makes me stronger every day ❤️",
"Because you always know how to make me feel loved ❤️",
"Because I still fall in love with you every single day ❤️",
"Because my heart chose you long ago and still chooses you ❤️",
"Because forever doesn't feel long enough with you ❤️",
"Because you're my biggest blessing ❤️",
"Because you're the reason behind my happiest smiles ❤️",
"Because I love everything about you ❤️",
"Because... you're simply YOU ❤️"

];

let current=0;

const reason=document.getElementById("reason");
const count=document.getElementById("count");
const btn=document.getElementById("nextBtn");

function typeWriter(text){

reason.innerHTML="";

let i=0;

const typing=setInterval(()=>{

reason.innerHTML+=text.charAt(i);

i++;

if(i>=text.length){

clearInterval(typing);

}

},30);

}

function showReason(){

count.innerHTML="Reason "+(current+1)+" of 50 ❤️";

typeWriter(reasons[current]);

}

showReason();

btn.onclick=function(){

current++;

if(current<reasons.length){

reason.style.opacity="0";

setTimeout(()=>{

showReason();

reason.style.opacity="1";

},300);

}else{

reason.innerHTML="<b>❤️ These are only the beginning...<br><br>I have thousands more reasons to love you. ❤️</b>";

count.innerHTML="Forever & Always ❤️";

btn.innerHTML="Forever ❤️";

}

};

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=Math.random()>0.5?"❤️":"💖";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(18+Math.random()*20)+"px";

heart.style.animationDuration=(5+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);

},700);

setInterval(()=>{

const petal=document.createElement("div");

petal.className="petal";

petal.innerHTML=Math.random()>0.5?"🌹":"🌸";

petal.style.left=Math.random()*100+"vw";

petal.style.fontSize=(18+Math.random()*15)+"px";

petal.style.animationDuration=(6+Math.random()*4)+"s";

document.body.appendChild(petal);

setTimeout(()=>petal.remove(),9000);

},1600);

function createSparkles(){

setInterval(()=>{

const s=document.createElement("div");

s.className="sparkle";

s.innerHTML=Math.random()>0.5?"✨":"💖";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.fontSize=(16+Math.random()*14)+"px";

document.body.appendChild(s);

setTimeout(()=>s.remove(),2500);

},600);

}
/* ❤️ MUSIC BUTTON ❤️ */

const musicBtn=document.createElement("button");

musicBtn.innerHTML="🎵";

musicBtn.style.position="fixed";
musicBtn.style.top="20px";
musicBtn.style.right="20px";
musicBtn.style.width="58px";
musicBtn.style.height="58px";
musicBtn.style.borderRadius="50%";
musicBtn.style.border="none";
musicBtn.style.background="#ff4f8b";
musicBtn.style.color="white";
musicBtn.style.fontSize="25px";
musicBtn.style.cursor="pointer";
musicBtn.style.zIndex="999";

document.body.appendChild(musicBtn);

musicBtn.onclick=function(){

alert("🎵 Our forever song will play here soon ❤️");

};

createSparkles();

/* ❤️ LOVE LETTER DATA ❤️ */

const voiceMessage = new Audio("letters/New Recording.m4a");
voiceMessage.preload = "auto";
voiceMessage.volume = 1;

const letterPhotos = [

"letters/IMG_0500.jpeg",
"letters/IMG_0503.jpeg",
"letters/IMG_0558.jpeg",
"letters/IMG_0639.jpeg",
"letters/IMG_0711.jpeg",
"letters/IMG_0926.jpeg",
"letters/IMG_0949.jpeg",
"letters/IMG_0992.jpeg",
"letters/IMG_1135.jpeg",
"letters/IMG_1163.jpeg"

];

const loveLetters = [

`<b>Hey Vish ❤️</b><br><br>Before you read these reasons... I just want you to know that every word on this page came straight from my heart. ❤️`,

`<b>My Love ❤️</b><br><br>Meeting you was one of the most beautiful things that ever happened to me.`,

`<b>Vish ❤️</b><br><br>Every smile... Every laugh... Every memory... became another reason for me to love you.`,

`<b>My Handsome ❤️</b><br><br>No matter what happened, my heart always chose you.`,

`<b>Forever ❤️</b><br><br>Distance, time and problems could never stop me from loving you.`,

`<b>You ❤️</b><br><br>Some reasons can never be written. They're only felt.`,

`<b>Thank You ❤️</b><br><br>Thank you for every smile, every call and every memory.`,

`<b>Promise ❤️</b><br><br>A part of my heart will always belong to you.`,

`<b>Millions ❤️</b><br><br>These are only a few words... my heart still has millions more.`,

`<b>I Love You ❤️</b><br><br>Now go read all 50 reasons. Every single one was written only for you.<br><br><b>Forever Yours,<br>Nandini ❤️</b>`

];

let currentLetter = 0;



const letter = document.createElement("div");

letter.innerHTML = "💌";

letter.style.position = "fixed";
letter.style.bottom = "25px";
letter.style.right = "20px";
letter.style.fontSize = "42px";
letter.style.cursor = "pointer";
letter.style.zIndex = "999";

document.body.appendChild(letter);
const popup = document.createElement("div");

popup.style.position="fixed";
popup.style.left="0";
popup.style.top="0";
popup.style.width="100%";
popup.style.height="100%";
popup.style.display="none";
popup.style.justifyContent="center";
popup.style.alignItems="center";
popup.style.background="rgba(0,0,0,.75)";
popup.style.zIndex="1000";

document.body.appendChild(popup);

function showLetter(){

popup.innerHTML=`

<div style="
width:92%;
max-width:520px;
height:88vh;
overflow:auto;
border-radius:30px;
padding:35px;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url('${letterPhotos[currentLetter]}');

background-size:cover;
background-position:center;

color:white;
text-align:center;
text-shadow:0 2px 10px black;
">

<h1 style="margin-bottom:20px;">💌</h1>

<div style="
font-size:22px;
line-height:2;
">

${loveLetters[currentLetter]}

</div>

<button
id="nextLetter"
style="
margin-top:35px;
padding:18px 40px;
border:none;
border-radius:50px;
background:#ff4f8b;
color:white;
font-size:20px;
cursor:pointer;
">

${currentLetter==9 ? "Start Reading My 50 Reasons ❤️" : "Continue ❤️"}

</button>

</div>

`;

}
letter.onclick=function(){

currentLetter=0;

showLetter();

popup.style.display="flex";

voiceMessage.pause();
voiceMessage.currentTime=0;

voiceMessage.play().catch(()=>{});

document.getElementById("nextLetter").onclick=function(){

currentLetter++;

if(currentLetter<letterPhotos.length){

showLetter();

document.getElementById("nextLetter").onclick=arguments.callee;

}else{

popup.style.display="none";

voiceMessage.pause();
voiceMessage.currentTime=0;

}

};

};

popup.onclick=function(e){

if(e.target===popup){

popup.style.display="none";

voiceMessage.pause();
voiceMessage.currentTime=0;

}

};
</script>

</body>

</html>
