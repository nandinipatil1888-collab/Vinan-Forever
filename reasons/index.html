<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vinan Forever ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top,#4b2a68,#12091d);
    overflow:hidden;
    font-family:"Georgia",serif;
    color:white;
}


/* Sparkles */

.sparkle{
    position:absolute;
    width:4px;
    height:4px;
    background:#ffd98a;
    border-radius:50%;
    animation: sparkle 3s infinite;
}

@keyframes sparkle{
    0%{
        opacity:0;
        transform:scale(0);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

    100%{
        opacity:0;
        transform:scale(0);
    }
}


/* Main container */

.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}


/* Book */

.book{
    width:300px;
    height:420px;
    background:
    linear-gradient(135deg,#5a2d68,#24112f);
    border-radius:12px;
    box-shadow:
    0 0 30px rgba(255,215,120,.5),
    inset 0 0 20px rgba(255,255,255,.15);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    border:3px solid #d9ad55;

    animation: float 3s infinite ease-in-out;
}


@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }

}


.book h1{
    font-size:32px;
    text-align:center;
    color:#ffe6a6;
}


.book p{
    margin-top:20px;
    font-size:18px;
    text-align:center;
}


.open{
    margin-top:35px;
    padding:12px 30px;
    border-radius:30px;
    border:none;

    background:#d9ad55;
    color:#2b102f;

    font-size:18px;
    cursor:pointer;
}


/* Hidden book pages */

#loveBook{
    display:none;
}


</style>

</head>


<body>


<div class="container">


<div class="book">

<h1>
❤️ Our Love Book ❤️
</h1>

<p>
A story written by two hearts...
</p>


<button class="open" onclick="openBook()">
Open Our Book 💌
</button>


</div>


<div id="loveBook">

</div>


</div>



<audio id="music" loop>

<source src="letter/New Recording.m4a">

</audio>



<script>


function openBook(){

document.querySelector(".book").style.display="none";


document.getElementById("loveBook").style.display="block";


let music=document.getElementById("music");

music.volume=0.4;

music.play();


}



function createSparkles(){

for(let i=0;i<80;i++){

let s=document.createElement("div");

s.className="sparkle";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*3+"s";


document.body.appendChild(s);

}

}


createSparkles();


</script>


</body>
</html>
