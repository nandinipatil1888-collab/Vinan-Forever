@keyframes bgMove{

50%{transform:translateY(-20px);}

flex-direction:column;

justify-content:center;

align-items:center;

padding:30px;

transform-origin:left;

transition:1.3s;

font-size:38px;

text-align:center;

}

.cover p{

text-align:center;

font-size:20px;

}

margin-top:40px;

padding:16px 34px;

font-size:18px;

border:none;

border-radius:40px;

background:#ffd875;

color:#4a174c;

cursor:pointer;

font-weight:bold;

transition:.3s;

}

.cover button:hover{

transform:scale(1.05);

.page{

position:absolute;

width:100%;

height:100%;

background:#fffaf1;

border-radius:16px;

display:none;

overflow:hidden;

box-shadow:0 15px 35px rgba(0,0,0,.25);

.photo{

position:absolute;

inset:0;

background-size:cover;

background-position:center;

opacity:.18;

filter:blur(1px);

}

.content{

position:relative;

z-index:2;

padding:25px;

height:100%;

display:flex;

flex-direction:column;

justify-content:space-between;

overflow-y:auto;

.content h2{

color:#7a1f63;

font-size:30px;

text-align:center;

margin-bottom:25px;

}

.content p{

color:#4b3b3b;

font-size:18px;

line-height:1.6;

text-align:center;

white-space:pre-line;

}

.next{

margin-top:35px;

padding:15px;

border:none;

border-radius:40px;

background:#b33d8d;

color:white;

font-size:18px;

cursor:pointer;

}

.sparkle{

position:fixed;

width:4px;

height:4px;

background:#ffd875;

border-radius:50%;

animation:float 6s linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh);

opacity:0;

}

30%{

opacity:1;

}

to{

transform:translateY(-100px);

opacity:0;

}

}
.voice-card{

background:rgba(255,255,255,.75);

padding:20px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 25px rgba(0,0,0,.15);

color:#7a1f63;

font-size:22px;

.voice-card p{

font-size:16px;

margin-top:15px;

padding:14px 25px;

border:none;

border-radius:40px;

background:#b33d8d;

color:white;

font-size:17px;

cursor:pointer;

const title=document.getElementById("title");

const text=document.getElementById("text");

const music=document.getElementById("music");

function showPage(){

photo.style.backgroundImage=`url(${photos[current%photos.length]})`;

title.textContent=pages[current].title;

text.textContent=pages[current].text;

}

function openBook(){

cover.style.transform="rotateY(-170deg)";

music.volume=0.4;

music.currentTime=0;

const playPromise=music.play();

if(playPromise!==undefined){

playPromise.catch(function(error){

console.log(error);

});

}

setTimeout(()=>{

cover.style.display="none";

page.style.display="block";

showPage();

},900);

}

function nextPage(){

current++;

if(current>=pages.length){

current=0;

}

showPage();

}
