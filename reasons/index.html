<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reasons I Love You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:linear-gradient(-45deg,#ffd6e7,#ffe6f2,#fff5f8,#ffd4e5);

background-size:400% 400%;

animation:bgMove 14s ease infinite;

}

@keyframes bgMove{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

.card{

position:relative;

z-index:5;

width:90%;

max-width:700px;

padding:35px;

border-radius:30px;

background:rgba(255,255,255,.55);

backdrop-filter:blur(18px);

box-shadow:0 15px 40px rgba(255,80,130,.25);

text-align:center;

animation:fadeUp .9s;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

font-size:38px;

color:#ff4f8b;

animation:heartbeat 1.8s infinite;

}

@keyframes heartbeat{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.06);

}

}

#count{

margin-top:15px;

font-size:18px;

color:#777;

}

#reason{

margin-top:35px;

font-size:30px;

line-height:1.7;

min-height:180px;

display:flex;

justify-content:center;

align-items:center;

color:#444;

transition:.4s;

padding:10px;

}

button{

margin-top:30px;

padding:18px 42px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:20px;

cursor:pointer;

transition:.3s;

box-shadow:0 0 25px rgba(255,79,139,.45);

}

button:hover{

transform:scale(1.08);

background:#ff2f73;

}

.heart{

position:fixed;

bottom:-40px;

pointer-events:none;

z-index:1;

animation:floatHeart linear forwards;

}

@keyframes floatHeart{

0%{

transform:translateY(0) scale(1);

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.8);

opacity:0;

}

}

.petal{

position:fixed;

top:-40px;

pointer-events:none;

z-index:2;

animation:fall linear forwards;

}

@keyframes fall{

0%{

transform:translateY(0) rotate(0deg);

}

100%{

transform:translateY(120vh) rotate(360deg);

}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Reasons I Love You ❤️</h1>

<div id="count">

Reason 1 of 50 ❤️

</div>

<div id="reason"></div>

<button id="nextBtn">

Show Me Another Reason ❤️

</button>

</div>

<script>
const reasons=[

"Because your smile makes my whole day brighter ❤️",

"Because your voice feels like home ❤️",

"Because every moment with you becomes a beautiful memory ❤️",

"Because you always know how to make me smile ❤️",

"Because your hugs are my safest place ❤️",

"Because you understand me even without words ❤️",

"Because your laugh is my favourite sound ❤️",

"Because life feels more beautiful with you ❤️",

"Because loving you is the easiest thing I've ever done ❤️",

"Because every day I fall in love with you all over again ❤️",

"Because you make ordinary days feel magical ❤️",

"Because my heart feels complete with you ❤️"

];

let current=0;

const reason=document.getElementById("reason");
const count=document.getElementById("count");
const btn=document.getElementById("nextBtn");

function typeWriter(text){

reason.innerHTML="";

let i=0;

const typing=setInterval(()=>{

reason.innerHTML+=text.charAt(i);

i++;

if(i>=text.length){

clearInterval(typing);

}

},30);

}

function showReason(){

count.innerHTML="Reason "+(current+1)+" of 50 ❤️";

typeWriter(reasons[current]);

}

showReason();

btn.onclick=function(){

current++;

if(current<reasons.length){

reason.style.opacity="0";

setTimeout(()=>{

showReason();

reason.style.opacity="1";

},300);

}else{

reason.innerHTML="<b>❤️ These are only the beginning...<br><br>I have thousands more reasons to love you. ❤️</b>";

count.innerHTML="Forever & Always ❤️";

btn.innerHTML="Continue Our Forever ❤️";

}

};

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=Math.random()>0.5?"❤️":"💖";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(18+Math.random()*20)+"px";

heart.style.animationDuration=(5+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},8000);

},700);

setInterval(()=>{

const petal=document.createElement("div");

petal.className="petal";

petal.innerHTML="🌹";

petal.style.left=Math.random()*100+"vw";

petal.style.fontSize=(18+Math.random()*12)+"px";

petal.style.animationDuration=(6+Math.random()*4)+"s";

document.body.appendChild(petal);

setTimeout(()=>{

petal.remove();

},9000);

},1800);
/* ❤️ Music Button ❤️ */

const musicBtn=document.createElement("button");

musicBtn.innerHTML="🎵";

musicBtn.style.position="fixed";
musicBtn.style.top="20px";
musicBtn.style.right="20px";
musicBtn.style.width="55px";
musicBtn.style.height="55px";
musicBtn.style.borderRadius="50%";
musicBtn.style.border="none";
musicBtn.style.background="#ff4f8b";
musicBtn.style.color="white";
musicBtn.style.fontSize="24px";
musicBtn.style.cursor="pointer";
musicBtn.style.zIndex="999";

document.body.appendChild(musicBtn);

musicBtn.onclick=function(){

alert("🎵 We'll add our romantic song in the final version ❤️");

};

/* ❤️ Love Letter ❤️ */

const letter=document.createElement("div");

letter.innerHTML="💌";

letter.style.position="fixed";
letter.style.bottom="25px";
letter.style.right="20px";
letter.style.fontSize="42px";
letter.style.cursor="pointer";
letter.style.zIndex="999";

document.body.appendChild(letter);

const popup=document.createElement("div");

popup.style.position="fixed";
popup.style.top="0";
popup.style.left="0";
popup.style.width="100%";
popup.style.height="100%";
popup.style.background="rgba(0,0,0,.65)";
popup.style.display="none";
popup.style.justifyContent="center";
popup.style.alignItems="center";
popup.style.zIndex="1000";

popup.innerHTML=`

<div style="width:90%;max-width:420px;background:white;padding:30px;border-radius:25px;text-align:center;box-shadow:0 0 35px rgba(255,79,139,.4);">

<h2 style="color:#ff4f8b;">💌 A Letter For You ❤️</h2>

<p style="margin-top:20px;line-height:1.8;font-size:18px;color:#555;">

Hey Handsome ❤️

<br><br>

Every reason on this page came straight from my heart.

<br><br>

Even after these reasons...

I'd still have thousands more waiting just for you.

<br><br>

❤️ Forever Yours,<br>

<b>Nandini ❤️</b>

</p>

<button id="closePopup"

style="margin-top:20px;padding:15px 28px;border:none;border-radius:40px;background:#ff4f8b;color:white;font-size:18px;cursor:pointer;">

Close ❤️

</button>

</div>

`;

document.body.appendChild(popup);

letter.onclick=function(){

popup.style.display="flex";

};

document.addEventListener("click",function(e){

if(e.target.id==="closePopup"){

popup.style.display="none";

}

});

</script>

</body>

</html>
