<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Our Love Book ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Georgia,serif;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(135deg,#2a0d40,#4d1979,#f2d27c);

overflow:hidden;

}

body::before{

content:"";

position:fixed;

inset:0;

background:

radial-gradient(circle at 20% 20%,rgba(255,255,255,.12),transparent 30%),

radial-gradient(circle at 80% 30%,rgba(255,215,0,.18),transparent 35%),

radial-gradient(circle at 60% 80%,rgba(255,255,255,.08),transparent 30%);

animation:bgMove 12s linear infinite;

}

@keyframes bgMove{

0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(0);}

}

.book{

position:relative;

width:340px;

height:560px;

perspective:2000px;

z-index:2;

}

.cover{

position:absolute;

width:100%;

height:100%;

background:linear-gradient(145deg,#6d1b7b,#3e0f52);

border-radius:16px;

box-shadow:

0 20px 45px rgba(0,0,0,.45),

inset 0 0 0 3px rgba(255,215,120,.25);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:30px;

transform-origin:left;

transition:1.3s;

}

.cover h1{

color:#ffd875;

font-size:38px;

text-align:center;

margin-bottom:20px;

}

.cover p{

color:white;

text-align:center;

font-size:20px;

line-height:1.6;

}

.cover button{

margin-top:40px;

padding:16px 34px;

font-size:18px;

border:none;

border-radius:40px;

background:#ffd875;

color:#4a174c;

cursor:pointer;

font-weight:bold;

transition:.3s;

}

.cover button:hover{

transform:scale(1.05);

}

.page{

position:absolute;

width:100%;

height:100%;

background:#fffaf1;

border-radius:16px;

display:none;

overflow:hidden;

box-shadow:0 15px 35px rgba(0,0,0,.25);

}

.photo{

position:absolute;

inset:0;

background-size:cover;

background-position:center;

opacity:.18;

filter:blur(1px);

}

.content{

position:relative;

z-index:2;

padding:25px;

height:100%;

display:flex;

flex-direction:column;

justify-content:space-between;

overflow-y:auto;

}

.content h2{

color:#7a1f63;

font-size:30px;

text-align:center;

margin-bottom:25px;

}

.content p{

color:#4b3b3b;

font-size:18px;

line-height:1.6;

text-align:center;

white-space:pre-line;

}

.next{

margin-top:35px;

padding:15px;

border:none;

border-radius:40px;

background:#b33d8d;

color:white;

font-size:18px;

cursor:pointer;

}

.sparkle{

position:fixed;

width:4px;

height:4px;

background:#ffd875;

border-radius:50%;

animation:float 6s linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh);

opacity:0;

}

30%{

opacity:1;

}

to{

transform:translateY(-100px);

opacity:0;

}

}

</style>

</head>

<body>

<div class="book">

<div class="cover" id="cover">

<h1>❤️ OUR LOVE BOOK ❤️</h1>

<p>

Every page holds a memory...

Every word holds my heart...

</p>

<button onclick="openBook()">

Open Our Forever ❤️

</button>

</div>

<div class="page" id="page">

<div class="photo" id="photo"></div>

<div class="content">

<h2 id="title"></h2>
<button class="next" onclick="document.getElementById('music').play()">
🎙️ Play My Voice
</button>
<p id="text"></p>

<button class="next" onclick="nextPage()">

Turn Page 📖

</button>

</div>

</div>

</div>

<audio id="music" controls style="display:none;">
<source src="New Recording.m4a" type="audio/mp4">
Your browser does not support audio.
</audio>
<script>

const photos=[

"letter/IMG_0500.jpeg",

"letter/IMG_0503.jpeg",

"letter/IMG_0558.jpeg",

"letter/IMG_0639.jpeg",

"letter/IMG_0711.jpeg",

"letter/IMG_0926.jpeg",

"letter/IMG_0949.jpeg",

"letter/IMG_0992.jpeg",

"letter/IMG_1135.jpeg",

"letter/IMG_1163.jpeg"

];

const pages=[

{

title:"💌 Letter One",

text:`My Love,

Before anything else...

Thank you for walking into my life.

You changed my ordinary days into beautiful memories.

You became my safest place, my happiness and my home.

I will choose you today, tomorrow and forever. ❤️`

},

{

title:"💖 Letter Two",

text:`Every smile of yours makes my heart smile.

Every hug feels like peace.

Every second with you becomes my favourite memory.

Thank you for loving me exactly the way I am. ❤️`

}

];

let current=0;

const cover=document.getElementById("cover");

const page=document.getElementById("page");

const photo=document.getElementById("photo");

const title=document.getElementById("title");

const text=document.getElementById("text");

const music=document.getElementById("music");

function showPage(){

photo.style.backgroundImage=`url(${photos[current%photos.length]})`;

title.textContent=pages[current].title;

text.textContent=pages[current].text;

}

function openBook(){

cover.style.transform="rotateY(-170deg)";

music.volume=0.4;

music.currentTime=0;

const playPromise=music.play();

if(playPromise!==undefined){

playPromise.catch(function(error){

console.log(error);

});

}

setTimeout(()=>{

cover.style.display="none";

page.style.display="block";

showPage();

},900);

}

function nextPage(){

current++;

if(current>=pages.length){

current=0;

}

showPage();

}

for(let i=0;i<45;i++){

const s=document.createElement("div");

s.className="sparkle";

s.style.left=Math.random()*100+"vw";

s.style.animationDelay=Math.random()*6+"s";

s.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(s);

}

</script>

</body>

</html>
