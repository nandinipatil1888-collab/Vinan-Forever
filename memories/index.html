<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:Arial,Helvetica,sans-serif;

overflow-x:hidden;

background:linear-gradient(180deg,#120022,#3b145f,#ffbfd8);

min-height:100vh;

padding:40px 20px;

position:relative;

}

/* ⭐ Stars */

.star{

position:fixed;

width:3px;

height:3px;

background:white;

border-radius:50%;

box-shadow:0 0 12px white;

animation:twinkle 2s infinite alternate;

pointer-events:none;

}

@keyframes twinkle{

from{

opacity:.3;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1.6);

}

}

/* ❤️ Hearts */

.heart{

position:fixed;

bottom:-40px;

pointer-events:none;

animation:floatHeart linear forwards;

}

@keyframes floatHeart{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

/* 🌹 Rose Petals */
.petal{

position:fixed;

top:-40px;

pointer-events:none;

animation:fallPetal linear forwards;

}

@keyframes fallPetal{

0%{

transform:translateY(0) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(120vh) rotate(360deg);

opacity:0;

}

}

/* ✨ Glitter */

.glitter{

position:fixed;

font-size:14px;

pointer-events:none;

animation:glitter 6s linear forwards;

}

@keyframes glitter{

0%{

transform:translateY(0) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}

}

.container{

max-width:850px;

margin:auto;

position:relative;

z-index:5;

}

h1{

text-align:center;

color:white;

font-size:46px;

text-shadow:0 0 18px #ff9ec8;

margin-bottom:40px;

}

.memory{

background:rgba(255,255,255,.18);

backdrop-filter:blur(18px);

border-radius:30px;

padding:25px;

margin-bottom:45px;

box-shadow:0 20px 55px rgba(255,105,180,.28);

opacity:0;

transform:translateY(40px);

animation:memoryAppear 1s ease forwards;

}

@keyframes memoryAppear{

to{

opacity:1;

transform:translateY(0);

}

}
.memory img{

width:100%;

border-radius:22px;

display:block;

box-shadow:0 12px 35px rgba(0,0,0,.25);

transition:.5s;

}

.memory img:hover{

transform:scale(1.03);

}
.memoryNumber{

text-align:center;

color:white;

font-size:20px;

margin-bottom:18px;

text-shadow:0 0 10px black;

}
.caption{

margin-top:18px;

font-size:24px;

line-height:1.8;

text-align:center;

color:white;

text-shadow:0 0 10px black;

min-height:70px;

}
.endingMessage{

text-align:center;

color:white;

font-size:24px;

line-height:1.8;

margin:50px 20px 20px;

text-shadow:0 0 12px black;

}
button{

display:block;

margin:50px auto 20px;

padding:18px 45px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:20px;

cursor:pointer;

box-shadow:0 0 25px rgba(255,105,180,.55);

}

button:hover{

transform:scale(1.08);

}

</style>

</head>

<body>

<div class="container">

<h1>📸 Our Beautiful Memories ❤️</h1>

<div id="gallery"></div>

<div class="endingMessage">

These are only a few moments from our beautiful story... ❤️
<br><br>
And I can't wait to create thousands more memories with you. ✨❤️

</div>

<button onclick="location.href='../reasons/'">

Continue Our Journey ❤️

</button>

</div>

<script>
const memories=[

{
img:"memory1.jpeg",
text:"Our first video call ❤️"
},

{
img:"memory2.jpeg",
text:"Our favourite date ❤️"
},

{
img:"memory3.jpeg",
text:"The day we started talking ❤️"
},

{
img:"memory4.jpeg",
text:"We couldn't stop laughing ❤️"
},

{
img:"memory5.jpeg",
text:"One of my favourite days ❤️"
},

{
img:"memory6.jpeg",
text:"Our first picture ❤️"
},

{
img:"memory7.jpeg",
text:"Just another beautiful day with you ❤️"
},

{
img:"memory8.jpeg",
text:"A memory I'll never forget ❤️"
},

{
img:"memory9.jpeg",
text:"My favourite picture of you ❤️"
},

{
img:"memory10.jpeg",
text:"Our longest call ❤️"
}

];

const gallery=document.getElementById("gallery");

memories.forEach((m,index)=>{

gallery.innerHTML+=`

<div class="memory">

<div class="memoryNumber">
Memory ${index+1} of 10 ❤️
</div>

<img src="${m.img}">

<div class="caption">${m.text}</div>

</div>

`;

});

</script>

</body>

</html>
