<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#fff5f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.container{

width:100%;
max-width:700px;

}

.card{

background:white;
border-radius:25px;
padding:25px;

box-shadow:0 15px 40px rgba(0,0,0,.15);

animation:fade .7s;

}

..photo{

width:100%;
height:auto;

max-width:100%;

max-height:80vh;

display:block;

margin:0 auto 20px auto;

object-fit:contain;

border-radius:20px;

box-shadow:0 10px 30px rgba(255,79,139,.20);

background:#fff;

}

.title{

font-size:34px;

color:#ff4f8b;

text-align:center;

margin-bottom:15px;

font-weight:bold;

}

.caption{

font-size:22px;

text-align:center;

line-height:1.7;

color:#555;

font-weight:500;

padding:10px 20px;

margin:20px 0 30px;

}

.counter{

text-align:center;

font-size:18px;

color:#999;

margin-bottom:20px;

}

.buttons{

display:flex;

justify-content:space-between;

margin-top:15px;

}

button{

padding:15px 30px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#ff2f73;

transform:scale(1.05);

}

.finish{

display:none;

text-align:center;

margin-top:25px;

}

.finish a{

display:inline-block;

padding:18px 35px;

background:#ff4f8b;

color:white;

text-decoration:none;

border-radius:50px;

font-size:22px;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="counter" id="counter"></div>

<img id="photo" class="photo">

<div class="title">📸 Our Beautiful Memories ❤️</div>

<div class="caption" id="caption"></div>

<div class="buttons">

<button onclick="previousMemory()">⬅ Previous</button>

<button onclick="nextMemory()">Next ❤️</button>

</div>

<div class="finish" id="finish">

<a href="../reasons/index.html">

Continue Our Story ❤️

</a>

</div>

</div>

</div>

<script>

const memories=[

{
photo:"memory1.jpeg",
caption:"📱 Our First Video Call ❤️<br>Even through a screen, you made my heart smile."
},

{
photo:"memory2.jpeg",
caption:"☕ Our Favourite Date ❤️<br>A day I'll always cherish because I was with you."
},

{
photo:"memory3.jpeg",
caption:"💬 The Day We Started Talking ❤️<br>Little did I know that one conversation would change my life forever."
},

{
photo:"memory4.jpeg",
caption:"😂 We Couldn't Stop Laughing ❤️<br>My favourite sound will always be your laughter."
},

{
photo:"memory5.jpeg",
caption:"🌸 One of My Favourite Days ❤️<br>A beautiful memory I'll carry in my heart forever."
},

{
photo:"memory6.jpeg",
caption:"📸 Our First Picture ❤️<br>The beginning of countless beautiful memories together."
},

{
photo:"memory7.jpeg",
caption:"💖 Just Another Beautiful Day With You ❤️<br>Every ordinary moment becomes extraordinary when I'm with you."
},

{
photo:"memory8.jpeg",
caption:"✨ A Memory I'll Never Forget ❤️<br>Some moments stay with us forever... this is one of them."
},

{
photo:"memory9.jpeg",
caption:"😍 My Favourite Picture of You ❤️<br>This smile is one of my favourite things in the world."
},

{
photo:"memory10.jpeg",
caption:"🌙 Our Longest Call ❤️<br>Hours felt like minutes because talking to you never gets old."
}

];
let current=0;

function showMemory(){

document.getElementById("photo").src=memories[current].photo;

document.getElementById("caption").innerHTML=memories[current].caption;

document.getElementById("counter").innerHTML="Memory "+(current+1)+" of "+memories.length;

if(current===memories.length-1){

document.querySelector(".buttons").style.display="none";

document.getElementById("finish").style.display="block";

}

else{

document.querySelector(".buttons").style.display="flex";

document.getElementById("finish").style.display="none";

}

}

function nextMemory(){

if(current<memories.length-1){

current++;

showMemory();

}

}

function previousMemory(){

if(current>0){

current--;

showMemory();

}

}

showMemory();

</script>

</body>

</html>
